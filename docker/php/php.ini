; Application PHP settings. Loaded last (zz-) so it wins over image defaults.

; ----------------------------------------------------------------------------
; Limits
; ----------------------------------------------------------------------------
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 20M

; ----------------------------------------------------------------------------
; Errors — log, never render. Overridden per-environment by Laravel itself.
; ----------------------------------------------------------------------------
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; ----------------------------------------------------------------------------
; Dates / encoding
; ----------------------------------------------------------------------------
date.timezone = UTC
default_charset = UTF-8

; ----------------------------------------------------------------------------
; OPcache
;
; validate_timestamps=1 keeps the bind-mounted dev container picking up edits.
; The prod image should flip this to 0 and rely on a rebuild to invalidate.
; ----------------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; ----------------------------------------------------------------------------
; Money-adjacent precision.
;
; Amounts are stored and computed as integer minor units, so PHP floats are
; never in the money path. These settings only affect incidental formatting.
; ----------------------------------------------------------------------------
precision = 17
serialize_precision = -1
