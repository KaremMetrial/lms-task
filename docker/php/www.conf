; php-fpm pool overrides. Loaded after the shipped www.conf.

[www]
; Match the host developer's UID (see Dockerfile ARG UID/GID) so that files
; written through the bind mount remain owned by the host user.
user = app
group = app

listen = 0.0.0.0:9000

; Dynamic is the right default for a dev box; a real deployment would size this
; from measured memory-per-worker rather than guessing.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers to bound the damage from any slow leak.
pm.max_requests = 500

; Consumed by the Dockerfile HEALTHCHECK via cgi-fcgi.
ping.path = /ping
ping.response = pong

; Surface worker output in `docker compose logs` instead of swallowing it.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
