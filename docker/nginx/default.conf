# Docker's embedded DNS.
#
# Needed because nginx resolves an upstream hostname ONCE at startup and caches the
# address forever. Recreating the app container gives it a new IP, and nginx keeps
# dialling the dead one — a 502 on every request while `docker compose ps` shows
# everything healthy. Restarting nginx hides it until the next recreate.
#
# Declaring a resolver and passing the upstream through a VARIABLE (below) makes
# nginx resolve per request instead, so the app container can be rebuilt freely.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Laravel's front controller: everything that is not a real file is routed
    # through index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git) even if one ends up under public/.
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        # Via a variable on purpose — see the resolver comment at the top of the file.
        # A literal `fastcgi_pass app:9000;` would be resolved once at startup.
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Long-running artisan-triggered requests are not a thing here, but
        # Filament table exports can be slow on large ledgers.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
